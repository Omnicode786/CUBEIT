name: SEO integrity smoke test

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "scripts/seo-smoke.mjs"
      - ".github/workflows/seo-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Full repository lint (pre-existing debt, informational)
        run: npm run lint
        continue-on-error: true
      - name: Lint SEO metadata, sitemap and smoke test
        run: npx eslint src/app/layout.tsx src/app/sitemap.ts scripts/seo-smoke.mjs
      - name: Build statically generated pages
        run: npm run build
      - name: Run local production server
        run: |
          npm run start -- -p 3897 > /tmp/cubeit-next.log 2>&1 &
          echo $! > /tmp/cubeit-next.pid
      - name: Assert HTTP indexability and navigation
        run: node scripts/seo-smoke.mjs http://127.0.0.1:3897
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/cubeit-next.log || true
